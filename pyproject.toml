[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-zoo"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[extensions]>=1.27.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "huggingface_hub",
    "openai",
    "google-genai",
    "python-dotenv>=1.0.1"
]

[project.scripts]
run-sql-agent = "agent_zoo.sql_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
link-mode = "copy"
